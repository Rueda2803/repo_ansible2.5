---
- name: Obtener usuarios de Active Directory y generar Excel
  hosts: all
  gather_facts: false
  tasks:
    - name: Exportar usuarios de Active Directory
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        Import-Module ImportExcel

        $usuarios = Get-ADUser -Filter * -Properties `
          EmailAddress, `
          Department, `
          Title, `
          LastLogonDate |
          Select-Object `
            Name,
            SamAccountName,
            Enabled,
            EmailAddress,
            Department,
            Title,
            LastLogonDate

        $usuarios | Export-Excel `
          -Path "C:\Temp\usuarios_AD.xlsx" `
          -WorksheetName "Usuarios" `
          -AutoSize `
          -AutoFilter
      register: resultado_excel

    - name: Mostrar resultado
      ansible.builtin.debug:
        var: resultado_excel