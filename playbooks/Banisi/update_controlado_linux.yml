---
- name: Verificación y Actualización de Sistema en Red Hat
  hosts: all
  become: true
  vars:
    log_path: "/home/logs_actualizaciones_linux"
  tasks:
    - name: Verificar paquetes actuales 
      ansible.builtin.dnf:
        list: installed
      register: paquetes_actuales

    - name: Guardar el reporte de actualizaciones en un archivo de log
      delegate_to: localhost
      become: false
      ansible.builtin.template:
        src: paquetes_actuales_template.j2
        dest: "{{ log_path }}/updates_{{ inventory_hostname }}_{{ ansible_date_time.date }}.log"

    - name: Actualizar todos los paquetes
      ansible.builtin.dnf:
        name: "*"
        state: latest
        update_cache: true

    - name: Verificar paquetes actualizados 
      ansible.builtin.dnf:
        list: installed
      register: paquetes_a_actualizar   

    - name: Guardar el reporte de actualizaciones en un archivo de log
      delegate_to: localhost
      become: false
      ansible.builtin.template:
        src: updates_templates.j2
        dest: "{{ log_path }}/updates_{{ inventory_hostname }}_{{ ansible_date_time.date }}.log"
    
    - name: Informar de la actualización
      ansible.builtin.debug:
        msg: "Todos los paquetes han sido actualizados a la última versión disponible excepto los relacionados con el kernel."
